status:
  scope: 'PROVED: the exact order of q modulo Phi_d(q); the repunit divisibility criterion; the Jacobi-sum
    norm dichotomy; the exact even-level evaluation; and the reduction of the k-fold Jacobi sum to Mathlib''s
    jacobiSum at k = 2. NOT PROVED and NOT CLAIMED: any cohomological statement of the source manuscript (concentration
    in degree k-1, the Frobenius-eigenvalue identification, the weight reading of the dichotomy, its Proposition
    4.1); its Theorem 6.1 on Hecke characters; its Theorems 7.1 and 8.1 and Corollaries 7.3 and 7.5 on Galois
    representations and the split cover; and its sections 9 to 12.'
  sorry_count: 0
  sorry_in_definitions: 0

  relationship: independent
  note: Mathlib is a prior formalization of several ingredients. It has the two-variable
    Jacobi sum (NumberTheory/JacobiSum/Basic.lean, jacobiSum, together with jacobiSum_mul_jacobiSum_inv,
    which is the algebraic form of the norm identity at k = 2), Gauss sums and
    gaussSum_mul_gaussSum_eq_card (NumberTheory/GaussSum.lean), the cyclotomic
    polynomials with isRoot_cyclotomic_iff and orderOf_root_cyclotomic_dvd (RingTheory/Polynomial/Cyclotomic/),
    and lifting-the-exponent (NumberTheory/Multiplicity.lean). The k-fold Jacobi
    sum defined in the Challenge extends jacobiSum from two characters to k of
    them and agrees with it at k = 2; that agreement is one of the compared theorems.
    Mathlib has no primitive-divisor (Bang-Zsigmondy) theorem in any form -- searched
    by name this session, zero hits -- and no k-fold Jacobi sum.
- id: https://github.com/nasqret/ZsigmondyChebyshev
  relationship: independent
  note: 'The nearest Lean 4 neighbour of the order statement found in a targeted
    search: an AI-assisted formalization of Zsigmondy''s theorem for Chebyshev
    polynomials (after S. Baranczuk, arXiv:1909.12143). It is a different theorem
    -- the Chebyshev-polynomial analogue, not the classical statement for a^n -
    b^n -- and nothing here depends on it. An older repository, sovesti/zsigmondy,
    is Lean 3 and so cannot be imported by a Lean 4 development. No public Lean
    4 formalization of the classical Bang-Zsigmondy theorem, or of the specialized-cyclotomic
    order statement, was identified. That search was targeted, not exhaustive,
    and absence from search is not proof that none exists.'
status:
  scope: 'PROVED: the exact
    order of q modulo Phi_d(q); the repunit divisibility criterion; the Jacobi-sum
    norm dichotomy; the exact even-level evaluation; and the reduction of the k-fold
    Jacobi sum to Mathlib''s jacobiSum at k = 2. NOT proved and NOT claimed: any
    cohomological statement of the source manuscript (concentration in degree k-1,
    multiplicity one, the identification of the Jacobi sum as a Frobenius eigenvalue,
    the weight reading of the dichotomy, the interior/boundary dichotomy of its
    Proposition 4.1); its Theorem 6.1 on compatible systems and Hecke characters;
    its Theorem 7.1, Lemma 7.2 and Corollaries 7.3 and 7.5 on Galois representations
    and Chebotarev density; its Theorem 8.1 on the (q-1)-fold split cover; and
    every statement in its sections 9 through 12.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

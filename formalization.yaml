    the author.'
fidelity:
  divergences: The compared statements are the arithmetic under the manuscript's theorems. (1) Its Theorem
    3.1 asserts the Jacobi sum is the Frobenius eigenvalue alpha_j = (-1)^(k-1) J and reads the dichotomy as
    a weight drop, and its Theorem 7.4 states its closed form for the same alpha_(p,d,k); the compared theorems
    state both for J alone, without the sign or any cohomology. (2) Its Lemma 2.1 also mentions the family
    d = 2 with q+1 a power of two; the formal statement takes (2,6) as the sole exception, checked for all
    q < 300, d < 60. (3) It states Corollary 2.2 only for the block lengths it uses; the compared theorem needs
    no hypothesis on k, both sides holding at k = 0 and failing at k = 1.
review:
  status: internal-review
  notes: 'Reviewed internally, mechanically: clean rebuild against Mathlib v4.32.0; the five compared theorems
    report exactly propext, Classical.choice and Quot.sound; no sorry, native_decide or axiom; the jacobiSumK
    bridge compiles as rfl; declarations diffed against the Challenge. All four statements were also recomputed
    by brute force. No human expert has reviewed the mathematics.'
alignment:
  namespace: CyclotomicRepunit
  statements:
  - source: Lemma 2.1 of the source manuscript, exact specialized cyclotomic order
    lean: CyclotomicRepunit.orderOf_eval_cyclotomic
    status: proved
    note: ord_(Phi_d(q))(q) = d for all q >= 2, d >= 2, with (q,d) = (2,6) excluded, the manuscript's list.
  - source: Corollary 2.2 of the source manuscript, digital visibility
    lean: CyclotomicRepunit.dvd_repunit_iff
    status: proved
    note: Divisibility of the repunit by the evaluated cyclotomic polynomial, in the integers, iff d | k.
  - source: Theorem 3.1 of the source manuscript, equation (3.x), the norm dichotomy
    lean: CyclotomicRepunit.jacobiSumK_norm_dichotomy
    status: proved
    note: Only the norm dichotomy. The cohomological content is not formalized; alpha_j is (-1)^(k-1) times
      J.
  - source: Theorem 7.4 of the source manuscript, all-even-level orbit classification
    lean: CyclotomicRepunit.jacobiSumK_even_level_eval
    status: proved
    note: Only the exact evaluation, again without the sign (-1)^(k-1). Euler-product consequences excluded.
  - source: Definitional fidelity of the one new definition; not a theorem of the manuscript
    lean: CyclotomicRepunit.jacobiSumK_two
    status: proved
    note: 'The k-fold Jacobi sum is Mathlib''s jacobiSum at k = 2: evidence it is the classical object.'

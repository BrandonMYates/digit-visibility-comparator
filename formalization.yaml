version: v0.4
project:
  name: Cyclotomic divisors of repunits and the degeneration of a Jacobi sum
  description: 'Formalizes in Lean 4 the arithmetic core of a structure theorem on base-q digit blocks. Fix
    q >= 2, a level d >= 2 and a block length k; write R_k(q) = 1 + q + ... + q^(k-1) for the base-q repunit
    and Phi_d(q) for the d-th cyclotomic polynomial at q, the level-d factor of q^k - 1. No field extension
    occurs anywhere: the vocabulary is elementary integer arithmetic and character sums over finite fields.
    Five statements are compared. (1) The multiplicative order of q modulo Phi_d(q) is exactly d, for every
    q >= 2 and d >= 2, with the single exception (q,d) = (2,6), where the order is 2. (2) Hence Phi_d(q) divides
    R_k(q) if and only if d divides k, away from that exception and with no hypothesis on k. (3) For K a finite
    field with #K = q^d and theta a character of exact order Phi_d(q), the k-fold Jacobi sum of the Frobenius-twisted
    tuple (theta^j, theta^(jq), ..., theta^(jq^(k-1))), j coprime to that order, has squared absolute value
    (#K)^(k-1) when d does not divide k and (#K)^(k-2) when it does, so (2) is exactly the degeneration locus.
    (4) For even d and prime p that sum has an exact closed value, uniform in k and independent of the primitive
    character: p^((d/2)(k-1)) off the locus and -p^((d/2)(k-2)) on it. (5) The one new definition, the k-fold
    Jacobi sum, reduces at k = 2 to Mathlib''s jacobiSum.


    SCOPE. The manuscript states (3) and (4) as facts about the compactly supported etale cohomology of a cyclic
    cover, where these sums are Frobenius eigenvalues and the dichotomy is a drop of one in weight. None of
    that geometry is asserted here, and Mathlib cannot express it: it has no etale cohomology and no weights.
    Its sections on Hecke characters, Galois representations and zeta functions are out of scope, and no compared
    statement mentions an L-function.


    PROVENANCE. The ingredients are classical and none is claimed as new: Bang-Zsigmondy for the order, the
    standard Gauss-Jacobi computation for the dichotomy, the classical semiprimitive evaluation at even level.
    What it claims is the assembly; a targeted search dated 19 July 2026 found no source stating it complete,
    which supports "potentially new as stated", not priority, and the residual collision risk it names is the
    Delsarte and hypergeometric-motive literature.


    AUDIENCE. Semiprimitive Gauss-sum evaluation and uniform cyclotomy, and the Fermat-motive community whose
    Frobenius eigenvalues are Jacobi sums.'

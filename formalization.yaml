version: v0.4
project:
  name: Cyclotomic divisors of repunits and the degeneration of a Jacobi sum
  description: 'This project formalizes in Lean 4 the arithmetic core of a structure
    theorem about base-q digit blocks. Fix an integer base q >= 2, a level d >=
    2, and a block length k. Write R_k(q) = 1 + q + ... + q^(k-1) for the base-q
    repunit of length k, and Phi_d(q) for the value at the integer q of the d-th
    cyclotomic polynomial, which is the level-d factor in q^k - 1 = product over
    d dividing k of Phi_d(q). No cyclotomic field extension and no Kummer field
    extension occurs anywhere in this project: the vocabulary throughout is elementary
    integer arithmetic and character sums over finite fields. Five statements
    are compared. (1) The multiplicative order of q modulo Phi_d(q) is exactly
    d, for every q >= 2 and every d >= 2, with the single exception (q,d) = (2,6),
    where Phi_6(2) = 3 = Phi_2(2) and the order is 2. This is the primitive-divisor
    theorem of Bang and Zsigmondy, in the form given by Birkhoff and Vandiver
    (1904), restated for the specialized cyclotomic integer and reproved in Lean.
    (2) Consequently Phi_d(q) divides R_k(q) if and only if d divides k, away
    from that one exception; no hypothesis on k is needed. (3) Let K be a finite
    field with #K = q^d, and let theta be a multiplicative character of K of exact
    order Phi_d(q). For every j coprime to that order, the k-fold Jacobi sum of
    the Frobenius-twisted tuple (theta^j, theta^(jq), ..., theta^(jq^(k-1))) has
    squared absolute value (#K)^(k-1) when d does not divide k, and (#K)^(k-2)
    when d divides k. So the divisibility criterion of (2) is exactly the locus
    on which this Jacobi sum degenerates by one power of #K. (4) For even d and
    prime p, that Jacobi sum has an exact closed value, uniform in the block length
    k and independent of which primitive character of order Phi_d(p) is chosen:
    it is p^((d/2)(k-1)) off the divisibility locus and -p^((d/2)(k-2)) on it.
    (5) The one new definition, the k-fold Jacobi sum, reduces at k = 2 to Mathlib''s
    two-variable jacobiSum. The exponent tuple (1, q, ..., q^(k-1)) is not a choice
    made to produce the conclusion: it is the vector of place values of a length-k
    block of base-q digits, and Phi_d(q) is the level-d factor of q^k - 1 in the
    same base. The two classical inputs collide because the product character
    of that tuple is theta^(j R_k(q)), which is trivial exactly when Phi_d(q)
    divides R_k(q); off that locus the Gauss-Jacobi product formula and the Gauss-sum
    norm identity give the full weight, and on it the degenerate identity for
    a product-trivial Jacobi sum gives one power less. The even-level evaluation
    rests on the semiprimitive, or uniform cyclotomy, condition p^(d/2) = -1 mod
    Phi_d(p), which statement (1) supplies. The audience is two live communities.
    First, semiprimitive Gauss-sum evaluation and uniform cyclotomy: Carlitz (1956),
    Baumert and McEliece (1972), Evans (1981), and Baumert, Mills and Ward, Uniform
    cyclotomy, J. Number Theory 14 (1982), 67-82, a line continued by Huczynska,
    Johnson and Paterson, Beyond uniform cyclotomy, Finite Fields Appl. 105 (2025),
    article 102604. Second, diagonal-hypersurface and Fermat motives whose Frobenius
    eigenvalues are Jacobi sums: Shioda and Katsura (1979), Ran (1980/81), Otsubo
    (2015), Nakagawa, Artin L-functions of diagonal hypersurfaces and generalized
    hypergeometric functions over finite fields, Hiroshima Math. J. 54 (2024),
    no. 3, and Otsubo and Yamazaki, Motivic Gauss and Jacobi sums, Ann. Fac. Sci.
    Toulouse (6) 35 (2026), 95-135, which is the closest prior art to the compared
    statements. Scope limitation, stated plainly. The source manuscript states
    (3) and (4) as facts about the compactly supported etale cohomology of a cyclic
    cover of the open simplex, in which these Jacobi sums are Frobenius eigenvalues
    and the dichotomy is a drop of exactly one in cohomological weight. None of
    that geometry is asserted anywhere in this project and no compared statement
    depends on it. Mathlib today has no etale cohomology with compact supports,
    no Frobenius action on l-adic cohomology and no theory of weights, so those
    geometric statements are not expressible; what is compared is the arithmetic
    underneath them. The source manuscript also contains sections on Hecke characters,
    Galois representations and the Riemann zeta function. None of that is in scope
    here, and no compared statement mentions any zeta function or L-function.
    On novelty: the ingredients are classical and are not claimed as new. The
    order statement is Bang-Zsigmondy; the norm dichotomy is the standard Gauss-Jacobi
    computation applied to this tuple; the even-level evaluation runs on the classical
    semiprimitive Gauss-sum evaluation. What the source manuscript claims, and
    what this entry records, is the assembly: the modulus Phi_d(q) together with
    the digit exponent vector, the divisibility criterion including the (2,6) collision,
    and the even-level evaluation uniform in k and independent of the orbit. In
    the manuscript''s own words, a targeted search dated 19 July 2026 found no
    source stating this complete assembly, which supports the designation "potentially
    new as stated," not a proof of priority. That search was targeted rather than
    systematic, and the manuscript''s own literature boundary names the Delsarte
    and hypergeometric-motive literature as the main residual collision risk. The
    contribution recorded here is the proof-assistant formalization and its auditable
    dependency chain.'

  methods:
  - method: agent
    models:
    - claude-opus-5
    - claude-fable-5
    framework: Claude Code
    tool_setup: 'The Challenge statement file, the comparator configuration and this
      metadata were produced by a Claude Code agent working from the author''s
      mathematical manuscript; every Mathlib declaration named in the Challenge
      documentation was verified by grep against the pinned Mathlib checkout rather
      than recalled, and the k = 2 reduction of the new definition was proved in a
      scratch file before the statement was frozen. The proof development (the pinned
      DigitVis library) was produced on 2026-08-26 by a lead agent (claude-opus-5)
      coordinating five worker assignments (claude-opus-5, at most three concurrent)
      against frozen lemma contracts, with independent re-verification -- clean
      rebuild, per-theorem axiom audit, comment-stripped scan for sorry and
      native_decide, and a whitespace-normalized diff of every compared declaration
      against the Challenge -- by a separate agent (claude-fable-5) under the
      author''s direction.'
    cost:
      wall_time: about 75 minutes of wall-clock for the proof development, concurrent agents
      spend_usd: subscription-based
      hardware: local Apple Silicon machine
    prompting_notes: 'No specification given to an agent was found to be mathematically
      wrong. One planning assumption was: the construction plan routed the semiprimitive
      Gauss-sum evaluation through Stickelberger or Davenport-Hasse and flagged it as
      the likely obstruction since Mathlib has neither; the lead agent instead proved
      it elementarily by averaging over the subgroup of (p^s - 1)-th roots of unity, and
      observed that in the k-fold product the sign the classical treatment determines
      separately cancels identically and is never evaluated. The plan''s separate finite
      checks for q = 2 were subsumed by a base-change bound and never appeared.'
  spend_usd: subscription-based
  notes: The mathematics is the author's. The Lean formalization is to be produced
    by automation under the author's direction and verified mechanically.
fidelity:
  divergences: 'The compared statements are the arithmetic underneath the source
    manuscript''s theorems, not those theorems as the manuscript states them. Four
    specific divergences. (1) The manuscript''s Theorem 3.1 asserts that the Jacobi
    sum is the geometric Frobenius eigenvalue alpha_j = (-1)^(k-1) J on a one-dimensional
    compactly supported cohomology line, and reads the norm dichotomy as a drop
    of one in cohomological weight. The compared theorem states the norm dichotomy
    for the Jacobi sum J alone; the sign (-1)^(k-1) and the entire cohomological
    reading are absent. (2) The manuscript''s Theorem 7.4 likewise states its closed
    form for alpha_(p,d,k); the compared theorem states it for J, which differs
    by that same sign. (3) The proof of the manuscript''s Lemma 2.1 mentions, besides
    (q,d) = (2,6), the Zsigmondy family d = 2 with q+1 a power of two, noting that
    the conclusion survives there. The formal statement takes (2,6) as the sole
    exception; that this is the correct and complete exception list was checked
    by direct computation of the order for every pair with q < 300 and d < 60.
    (4) The manuscript states its Corollary 2.2 for the block lengths it uses;
    the compared theorem carries no hypothesis on k, which is correct because both
    sides hold at k = 0 and both fail at k = 1. In addition, the manuscript states
    Theorem 7.4 for a rational prime p, and the compared even-level theorem keeps
    that hypothesis, while the compared norm dichotomy is stated for a general
    base q >= 2 with #K = q^d, which forces q to be a prime power and matches the
    generality of the manuscript''s Theorem 3.1.'
review:
  status: internal-review
  notes: 'Reviewed internally, mechanically: the pinned library was rebuilt from a clean
    checkout against Mathlib v4.32.0; each of the five compared theorems was checked with
    #print axioms to depend on exactly propext, Classical.choice and Quot.sound; a
    comment-stripped scan found no sorry, native_decide or axiom declarations; the
    definitional bridge between the Challenge''s jacobiSumK and the library''s was
    compiled as an rfl check; and every compared declaration was diffed, whitespace-
    normalized, against the Challenge text. No human expert has reviewed the
    mathematics. Facts established at the drafting stage, kept for provenance: The source manuscript has not
    been peer reviewed and is not public. Its computational apparatus is a validation
    suite of 22 programs, described in the manuscript as regression evidence for
    the exact arguments and explicitly not as the basis of any theorem; that suite
    was re-run from a clean invocation on 26 August 2026 and reported all 22 programs
    passing with no stderr and no drift in any of the 31 recorded artifact digests,
    under a different Python version than the one in its recorded receipt. That
    is a reproducibility fact about the manuscript''s own package and is recorded
    for provenance only: it is not evidence for any compared statement, and no
    script output has any standing as proof here. Independently of the manuscript,
    and independently of that suite, the following were recomputed from scratch
    while preparing this entry. The exact order of q modulo Phi_d(q) was computed
    directly for every pair with 2 <= q < 300 and 2 <= d < 60, and (q,d) = (2,6)
    was the only pair where it is not d. The divisibility criterion was checked
    with no hypothesis on the block length for every q < 60, d < 16 and k < 60,
    with no counterexample. The Jacobi-sum norm dichotomy was checked by brute-force
    enumeration over the finite field for a range of (q,d,k) including non-prime
    prime-power bases q = 4, 8, 9 and every unit residue j, and the exact even-level
    value was checked including its sign branch. A literature search completed
    26 August 2026 verified every bibliographic locator recorded above against
    primary sources, and identified no public Lean 4 formalization of the classical
    Bang-Zsigmondy theorem or of the specialized-cyclotomic order statement. That
    search is recorded but not exhaustive, and absence from search is not proof
    of open status.'
alignment:
  namespace: CyclotomicRepunit
  statements:
  - source: Lemma 2.1 of the source manuscript, "Exact specialized cyclotomic order"
    lean: CyclotomicRepunit.orderOf_eval_cyclotomic
    module: Challenge
    status: proved
    note: The manuscript writes the modulus as M_d(q) = Phi_d(q) and the conclusion
      as ord_(Phi_d(q))(q) = d. The Lean statement is the multiplicative order
      of the image of q in ZMod of the natural absolute value of the evaluation
      of the d-th cyclotomic polynomial at q. Stated for all q >= 2 and d >= 2
      with (q,d) = (2,6) excluded, which is the manuscript's exception list.
  - source: Corollary 2.2 of the source manuscript, "Digital visibility"
    lean: CyclotomicRepunit.dvd_repunit_iff
    module: Challenge
    status: proved
    note: 'The manuscript names the left-hand side "level d is visible at block
      length k". The Lean statement uses no such predicate: it states the divisibility
      of the repunit sum by the evaluated cyclotomic polynomial, both written in
      the integers, and asserts it equivalent to d dividing k.'
  - source: Theorem 3.1 of the source manuscript, equation (3.x), the norm dichotomy
    lean: CyclotomicRepunit.jacobiSumK_norm_dichotomy
    module: Challenge
    status: proved
    note: Only the norm dichotomy is compared. The cohomological content of that
      theorem -- vanishing outside degree k-1, one-dimensionality, the identification
      of the Jacobi sum as a geometric Frobenius eigenvalue, and the reading of
      the dichotomy as a one-step weight drop -- is not formalized and is not expressible
      in Mathlib today. The manuscript's eigenvalue alpha_j equals (-1)^(k-1) times
      the Jacobi sum the compared theorem is about.
  - source: Theorem 7.4 of the source manuscript, "All-even-level orbit classification",
      equation (7.x)
    lean: CyclotomicRepunit.jacobiSumK_even_level_eval
    module: Challenge
    status: proved
    note: Only the exact evaluation of the Jacobi sum is compared, again without
      the sign (-1)^(k-1) that converts it to the manuscript's alpha_(p,d,k). The
      Euler-product consequences drawn from it in that theorem, and its (2,6) collision
      correction, are not formalized.
  - source: Definitional fidelity of the one new definition; not a theorem of the
      source manuscript
    lean: CyclotomicRepunit.jacobiSumK_two
    module: Challenge
    status: proved
    note: Records that the k-fold Jacobi sum defined in the Challenge is Mathlib's
      two-variable jacobiSum when k = 2. Included as auditable evidence that the
      new definition is the classical object and not a convenient surrogate.

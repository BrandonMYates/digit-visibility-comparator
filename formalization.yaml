    prompting_notes: 'No specification was found to be mathematically wrong. One planning assumption was: the
      plan routed the semiprimitive Gauss-sum evaluation through Stickelberger or Davenport-Hasse and flagged
      it as the likely obstruction, Mathlib having neither, but it was instead proved elementarily by averaging
      over the subgroup of (p^s - 1)-th roots of unity. Recorded with it: in the k-fold product the sign that
      the classical treatment determines separately cancels identically and is never evaluated, and the plan''s
      separate finite checks for q = 2 were subsumed by a base-change bound and never appeared.'
  spend_usd: subscription-based
